name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is the required gate. The CLI is pure JS (one pure-JS dependency,
        # node:sqlite built-in); its unix subprocess path is identical on macOS and
        # Linux. macOS x64 Node 22 and 24 both passed CI when runners were available,
        # but GitHub macOS hosted runners are capacity-constrained and frequently
        # cancel while queued (never assigned a runner), so they are excluded from
        # the required matrix to keep CI reliably green.
        os: [ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test built CLI
        run: |
          node dist/cli.js version
          node dist/cli.js demo --json > /tmp/demo-audit.json
          node -e "const r=require('/tmp/demo-audit.json'); if(r.mode!=='demo'||!r.findings.length) process.exit(1)"
          node dist/cli.js experiment demo --json > /tmp/demo-exp.json
          node -e "const o=require('/tmp/demo-exp.json'); if(o.record.status!=='completed'||!o.comparison.verdict.winnerConfigId) process.exit(1)"
