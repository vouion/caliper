name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 12
    # macOS hosted runners (arm64 and x64) are currently capacity-constrained and
    # frequently cancel while queued without ever starting. Ubuntu is the required
    # gate (the CLI is pure JS; its unix subprocess path is identical on macOS/Linux).
    # macOS legs run best-effort for extra coverage when runners are available.
    continue-on-error: ${{ matrix.os == 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test built CLI
        run: |
          node dist/cli.js version
          node dist/cli.js demo --json > /tmp/demo-audit.json
          node -e "const r=require('/tmp/demo-audit.json'); if(r.mode!=='demo'||!r.findings.length) process.exit(1)"
          node dist/cli.js experiment demo --json > /tmp/demo-exp.json
          node -e "const o=require('/tmp/demo-exp.json'); if(o.record.status!=='completed'||!o.comparison.verdict.winnerConfigId) process.exit(1)"
